services:
  redis:
    image: redis:7-alpine
    container_name: story-writing-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Media lives in SAI Drive (no object store of our own). Locally: an in-memory FAKE of Drive's
  # app API (scripts/fake-drive.mjs, the same fake the test suites use). Empty after every restart.
  fake-drive:
    image: node:20-alpine
    container_name: story-writing-fake-drive
    working_dir: /app
    command: ["node", "scripts/fake-drive.mjs", "--host", "0.0.0.0", "--port", "8150", "--quiet"]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./server/tests/fake-drive-http.mjs:/app/server/tests/fake-drive-http.mjs:ro
    ports:
      - "8150:8150"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: story-writing-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DRIVE_APP_API_URL=http://fake-drive:8150
      - DRIVE_APP_API_SECRET=drive-test-secret-0123456789abcdef0123456789abcdef
      - DRIVE_CARETAKER_SUB=u_0000000000000001
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - fake-drive
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: story-writing-worker
    command: ["node", "server/jobs/workers.js"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DRIVE_APP_API_URL=http://fake-drive:8150
      - DRIVE_APP_API_SECRET=drive-test-secret-0123456789abcdef0123456789abcdef
      - DRIVE_CARETAKER_SUB=u_0000000000000001
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - fake-drive
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: story-writing-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
