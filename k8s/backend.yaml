apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: story-writing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-credentials
      containers:
        - name: backend
          image: solutionsai/story-writing-backend:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: story-writing-config
            - secretRef:
                name: story-writing-secrets
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: story-writing
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
