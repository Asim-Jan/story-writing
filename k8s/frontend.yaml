apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: story-writing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-credentials
      containers:
        - name: frontend
          image: solutionsai/story-writing-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 64m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: story-writing
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
