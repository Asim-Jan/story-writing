apiVersion: v1
kind: ConfigMap
metadata:
  name: story-writing-config
  namespace: story-writing
data:
  # Server
  NODE_ENV: "production"
  PORT: "3001"

  # Database (internal cluster DNS)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "story_writing"
  POSTGRES_USER: "story_user"
  POSTGRES_SSL: "false"

  # Redis (internal cluster DNS)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # MinIO (internal cluster DNS)
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET_IMAGES: "story-images"
  MINIO_BUCKET_AUDIO: "story-audio"
  MINIO_BUCKET_COMICS: "story-comics"
  MINIO_BUCKET_VIDEOS: "story-videos"

  # App URLs
  CLIENT_URL: "https://story-writing.solutionsai.co.uk"
  API_URL: "https://story-writing.solutionsai.co.uk"

  # Email
  FROM_EMAIL: "noreply@story-writing.solutionsai.co.uk"

  # SAI gateway (the AI backend) — pooled app key, group "apps"
  SAI_API_BASE_URL: "https://api.solutionsai.co.uk/v1"
  SAI_CHAT_MODEL: "sai-chat"
  SAI_CHAT_FAST_MODEL: "sai-chat-fast"
  OPENAI_MAX_TOKENS: "16384"

  # Database feature flags
  USE_POSTGRES: "true"
  DUAL_WRITE: "false"
  READ_FROM_POSTGRES: "true"
