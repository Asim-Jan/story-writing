apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: story-writing-ingress
  namespace: story-writing
  annotations:
    # Traefik (k3s default ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Strip /api prefix is NOT needed — backend expects /api/* paths
spec:
  rules:
    - host: storywriting.solutionsai.co.uk
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
